ja:
  # 曜日の日本語化対応
  date:
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
  # 時間形式の日本語化対応
  time:
    formats:
      date: "%Y年%-m月%-d日(%a)"
      time: "%H時%M分"
      long: "%Y年%-m月%-d日(%a) %H時%M分"
  static_pages:
    top:
      title: ハナシドキ
      to_status_index: ステータス一覧へ
      login: ログインする
      create: 新規登録する
      catchcopy:
        line1: 「今、話しかけてもいい？」を、
        line2: 聞かなくてもわかる。
      description:
        line1: ハナシドキは、相手の今の状況を
        line2: ステータスで共有して、
        line3: 話しかけるタイミングを
        line4: 見つけやすくします。
        line5: ちょっとした「話しかけたい」を、
        line6: もっと気軽に。
        line7: そんなきっかけをお手伝いします。
  flash_messages:
    require_login: ログインしてください
  user_sessions:
    new:
      title: ログイン画面
      email: メールアドレス
      password: パスワード
      login: ログインする
      create: 新規登録はこちら
      to_top_page: トップページに戻る
    create:
      success: ログインしました
      failure: ログインに失敗しました
    destroy:
      success: ログアウトしました
  users:
    new:
      title: ユーザー登録
      last_name: 姓
      first_name: 名
      email: メールアドレス
      password: パスワード
      password_confirmation: パスワード（確認用）
      registration: 登録する
      to_top_page: トップページに戻る
      placeholder:
        last_name: 例：田中
        first_name: 例：花子
        email: 例：example@example.com
        password: 3文字以上
    create:
      success: ユーザー登録が完了しました
      failure: ユーザー登録に失敗しました
    statuses:
      edit:
        title: ステータス編集
        name: 名前
        now_status: 今のステータス
        status_message: 今の状況をひとこと（30文字まで）
        status_change: ステータスを変更する
      update:
        success: 更新が完了しました
        failure: 更新に失敗しました
  statuses:
    index:
      title: ステータス一覧
      status_edit: 編集する
      updated_time: 最終更新：
  activerecord:
    attributes:
      # Userモデルの「項目名」を日本語にする
      user:
        email: メールアドレス
        last_name: 姓
        first_name: 名
        password: パスワード
        password_confirmation: パスワード（確認用）
      # Statusモデルの「項目名」を日本語にする
      status:
        status_message: 今の状況をひとこと
    errors:
      messages:
        taken: が登録できません
      models:
        # Userモデルの「エラー内容」を日本語にする
        user:
          attributes:
            email:
              blank: を入力してください
            last_name:
              blank: を入力してください
            first_name:
              blank: を入力してください
            password:
              blank: を入力してください
              too_short: "は%{count}文字以上で入力してください"
            password_confirmation:
              blank: を入力してください
        # Statusモデルの「エラー内容」を日本語にする
        status:
          attributes:
            status_message:
              too_long: "は%{count}文字以内で入力してください"
  header:
    title: ハナシドキ
    logout: ログアウトする